services:
  finance-tracker:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ADDR: ":8080"
      DATABASE_URL: "file:/data/finance-tracker.db?_foreign_keys=on&_busy_timeout=5000"
      APP_USERNAME: "${APP_USERNAME}"
      APP_PASSWORD: "${APP_PASSWORD}"
    volumes:
      - finance_data:/data
    expose:
      - "8080"

  cloudflared:
    image: cloudflare/cloudflared:2026.5.0
    restart: unless-stopped
    depends_on:
      - finance-tracker
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  finance_data:
