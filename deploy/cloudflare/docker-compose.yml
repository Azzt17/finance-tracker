services:
  finance-tracker:
    image: ghcr.io/azzt17/finance-tracker:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      ADDR: ":8080"
      DATABASE_URL: "file:/data/finance-tracker.db?_foreign_keys=on&_busy_timeout=5000"
      APP_USERNAME: "${APP_USERNAME}"
      APP_PASSWORD: "${APP_PASSWORD}"
    volumes:
      - finance_data:/data
    ports:
      - "127.0.0.1:8080:8080"

  cloudflared:
    image: cloudflare/cloudflared:2026.5.0
    restart: unless-stopped
    depends_on:
      - finance-tracker
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  finance_data:
