app = "finance-tracker"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  ADDR = ":8080"
  DATABASE_URL = "file:/data/finance-tracker.db?_foreign_keys=on&_busy_timeout=5000"

[[mounts]]
  source = "finance_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"
