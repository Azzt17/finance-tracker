name: CI + Security Pipeline

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master"]

env:
  GO_VERSION: "1.25.9"
  BINARY_NAME: finance-tracker

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # JOB 1 — Lint & Static Analysis
  # ──────────────────────────────────────────────
  lint:
    name: "🔍 Lint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  # ──────────────────────────────────────────────
  # JOB 2 — Unit Test + Coverage
  # ──────────────────────────────────────────────
  test:
    name: "🧪 Test"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests (race detector + coverage)
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage threshold check (min 60%)
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 60" | bc -l) )); then
            echo "❌ Coverage ${COVERAGE}% is below threshold of 60%"
            exit 1
          fi
          echo "✅ Coverage passed: ${COVERAGE}%"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  # ──────────────────────────────────────────────
  # JOB 3 — SAST: gosec
  # Mendeteksi hardcoded secrets, SQL injection risk,
  # insecure crypto, dangerous function calls, dll.
  # ──────────────────────────────────────────────
  sast:
    name: "🛡️ SAST (gosec)"
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      security-events: write # untuk upload SARIF ke GitHub Security tab
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run gosec
        uses: securego/gosec@master
        with:
          # -no-fail → pipeline tidak gagal, tapi tetap upload hasil ke Security tab
          # Ubah ke args: '' jika ingin pipeline gagal saat ada finding HIGH/CRITICAL
          args: "-no-fail -fmt sarif -out gosec-results.sarif ./..."

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec-results.sarif

  # ──────────────────────────────────────────────
  # JOB 4 — Dependency Vulnerability Scan (govulncheck)
  # Menggunakan Go official vulnerability database
  # dari https://vuln.go.dev
  # ──────────────────────────────────────────────
  vuln-check:
    name: "🔒 Dependency Vuln (govulncheck)"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        # Exit code != 0 jika ada known vulnerability yang aktif dipanggil dalam kode
        run: govulncheck ./...

  # ──────────────────────────────────────────────
  # JOB 5 — Dependency License & Supply Chain Check
  # Memastikan tidak ada dependency dengan lisensi
  # berbahaya atau typosquatting package
  # ──────────────────────────────────────────────
  dependency-review:
    name: "📦 Dependency Review"
    runs-on: ubuntu-latest
    # Hanya berjalan pada Pull Request
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Blok PR jika ada dependency dengan lisensi non-komersial atau CVE
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0

  # ──────────────────────────────────────────────
  # JOB 6 — Secret Scanning (Gitleaks)
  # Mencegah hardcoded API key, token, password,
  # private key masuk ke repository
  # ──────────────────────────────────────────────
  secret-scan:
    name: "🔑 Secret Scan (gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history untuk scan seluruh commit history, bukan hanya HEAD
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────
  # JOB 7 — Build (gating job)
  # Hanya berjalan jika semua security job passed.
  # Binary tidak akan terbuild jika ada issue keamanan.
  # ──────────────────────────────────────────────
  build:
    name: "🏗️ Build"
    runs-on: ubuntu-latest
    needs: [test, sast, vuln-check, secret-scan]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build \
            -ldflags="-s -w -X main.version=${{ github.sha }}" \
            -trimpath \
            -o ${{ env.BINARY_NAME }} \
            ./...

        # Flag penjelasan:
        # CGO_ENABLED=0  → static binary, tidak ada C dependency (lebih portable & aman)
        # -s -w          → strip debug symbols (binary lebih kecil, harder to reverse)
        # -X main.version→ embed commit SHA ke binary untuk traceability
        # -trimpath      → hapus absolute build path (tidak leak info filesystem kamu)

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ github.sha }}
          path: ${{ env.BINARY_NAME }}
          retention-days: 3
