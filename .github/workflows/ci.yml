name: CI + Security Pipeline

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.25.9"
  BINARY_NAME: finance-tracker
  GOLANGCI_LINT_VERSION: v2.12.2
  GOSEC_VERSION: v2.26.1
  GOVULNCHECK_VERSION: v1.3.0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  module-hygiene:
    name: Module Hygiene
    runs-on: ubuntu-latest
    outputs:
      has_go_files: ${{ steps.detect.outputs.has_go_files }}
      has_packages: ${{ steps.detect.outputs.has_packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Detect Go project state
        id: detect
        run: |
          if find . -path ./.git -prune -o -name '*.go' -type f -print -quit | grep -q .; then
            echo "has_go_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_go_files=false" >> "$GITHUB_OUTPUT"
          fi

          package_count=$(go list ./... 2>/dev/null | wc -l | tr -d ' ')
          if [ "$package_count" -gt 0 ]; then
            echo "has_packages=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_packages=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download modules
        run: go mod download

      - name: Verify module checksums
        run: go mod verify

      - name: Check go.mod and go.sum are tidy
        if: steps.detect.outputs.has_packages == 'true'
        run: go mod tidy -diff

      - name: Check Go formatting
        if: steps.detect.outputs.has_go_files == 'true'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following Go files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: module-hygiene
    if: needs.module-hygiene.outputs.has_packages == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: module-hygiene
    if: needs.module-hygiene.outputs.has_packages == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests with race detector and coverage
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Enforce coverage threshold
        run: |
          coverage=$(go tool cover -func=coverage.out | awk '/^total:/ { sub(/%/, "", $3); print $3 }')
          echo "Total coverage: ${coverage}%"
          awk -v coverage="$coverage" 'BEGIN { exit !(coverage >= 60) }'

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7
          if-no-files-found: error

  sast:
    name: SAST
    runs-on: ubuntu-latest
    needs: module-hygiene
    if: needs.module-hygiene.outputs.has_packages == 'true'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run gosec
        run: |
          go run github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }} \
            -fmt sarif \
            -out gosec-results.sarif \
            ./...

      - name: Upload gosec SARIF
        if: always() && hashFiles('gosec-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec-results.sarif

  vuln-check:
    name: Dependency Vulnerability Check
    runs-on: ubuntu-latest
    needs: module-hygiene
    if: needs.module-hygiene.outputs.has_packages == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

      - name: Run govulncheck
        run: govulncheck ./...

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [module-hygiene, lint, test, sast, vuln-check, secret-scan]
    if: needs.module-hygiene.outputs.has_packages == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build all packages
        run: go build -trimpath ./...

      - name: Build application binary
        run: |
          mkdir -p dist
          if [ -d "./cmd/${BINARY_NAME}" ]; then
            go build \
              -trimpath \
              -ldflags="-s -w -X main.version=${GITHUB_SHA}" \
              -o "dist/${BINARY_NAME}" \
              "./cmd/${BINARY_NAME}"
          else
            echo "No ./cmd/${BINARY_NAME} package found; binary artifact skipped."
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BINARY_NAME }}-${{ github.sha }}
          path: dist/
          retention-days: 3
          if-no-files-found: ignore
